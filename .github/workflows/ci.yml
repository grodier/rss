name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PRs: a new push to the same PR cancels the older run. Pushes to main: every
# commit gets its own group (run_id is unique), so no main run is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test # this is the required-status-check name; don't rename casually
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17 # matches compose.yml
        env:
          POSTGRES_USER: rssapp
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: rssapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rssapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RSS_TEST_DB_DSN: postgres://rssapp:ci-password@localhost:5432/rssapp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # single source of truth for the Go version; caches modules by default

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: migrate
        run: go run ./cmd/www migrate -db-dsn "$RSS_TEST_DB_DSN"

      - name: test
        run: go test -race -count=1 ./...

  # Checks infra/ without credentials or state: -backend=false skips the R2 backend.
  terraform:
    name: terraform # a required status check; don't rename casually
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10" # required_version in infra/versions.tf
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: terraform init
        run: terraform -chdir=infra init -backend=false

      - name: terraform validate
        run: terraform -chdir=infra validate

  # Builds the container images (the app, and the nightly backup from
  # deploy/backup) on every event; pushes them to GHCR and attests their
  # provenance only for pushes to main. Deploys reference the app's digest,
  # never a tag.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/grodier/rss:sha-${{ github.sha }}
            ghcr.io/grodier/rss:main

      - name: attest build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/grodier/rss
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # deploy.yml deploys it to Render's rss-backup cron job by digest; see
      # "Backups and restore" in infra/README.md.
      - name: build backup
        id: build-backup
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/grodier/rss-backup:sha-${{ github.sha }}
            ghcr.io/grodier/rss-backup:main

      - name: attest backup build provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/grodier/rss-backup
          subject-digest: ${{ steps.build-backup.outputs.digest }}
          push-to-registry: true

  # Every push to main that passes CI deploys; merging the PR is the approval.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_BACKUP_JOB_ID: ${{ secrets.RENDER_BACKUP_JOB_ID }}
