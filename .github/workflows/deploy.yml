name: Deploy

# Deploys the image CI built for a commit to the Render service, by digest.
# CI calls it for every push to main; run it by hand with an earlier commit's
# SHA to roll back (that doesn't undo migrations). See "Deploys" in
# infra/README.md.
on:
  workflow_call:
    inputs:
      sha:
        description: Full SHA of the commit whose image to deploy
        required: true
        type: string
    secrets:
      RENDER_API_KEY:
        required: true
      RENDER_SERVICE_ID:
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: Full SHA of the commit whose image to deploy (a main commit CI pushed an image for)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # One deploy at a time, never cancelled midway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SHA: ${{ inputs.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      # The tag only says which image; the deploy names the digest, so it runs
      # exactly the image CI built and tested.
      - name: resolve the digest
        id: digest
        run: |
          if ! [[ $SHA =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"
            exit 1
          fi
          image=ghcr.io/grodier/rss
          if ! digest=$(docker buildx imagetools inspect "$image:sha-$SHA" --format '{{.Manifest.Digest}}'); then
            echo "::error::No image $image:sha-$SHA. CI pushes one for every commit on main that passes its tests."
            exit 1
          fi
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"

      # Follows the deploy's status rather than only polling /healthcheck, so a
      # failed pre-deploy (migrate refusing a schema change) fails in seconds,
      # with the reason, instead of at a timeout.
      - name: deploy
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          render() {
            curl -sS --fail-with-body -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "$@"
          }
          service=https://api.render.com/v1/services/$RENDER_SERVICE_ID

          # Render answers 202, with no deploy ID, when it queues the deploy
          # behind one already running (from the dashboard or a Terraform apply).
          if ! resp=$(render -X POST -H 'Content-Type: application/json' \
              -d "$(jq -n --arg ref "$REF" '{imageUrl: $ref}')" "$service/deploys") ||
            ! id=$(jq -re .id <<<"$resp"); then
            echo "$resp"
            echo "::error::Render didn't return a deploy ID. If it queued the deploy behind one already running, it still deploys afterwards; follow it in Render's dashboard."
            exit 1
          fi
          echo "Deploying $REF ($id)"

          while :; do
            sleep 10
            status=$(render --retry 3 "$service/deploys/$id" | jq -r .status)
            case $status in
              live)
                break
                ;;
              pre_deploy_failed)
                echo "::error::The pre-deploy command (www migrate) failed, so the old version keeps serving; its output is in the deploy's logs in Render's dashboard. If migrate refused because the migrations changed, run the Reset production database workflow."
                exit 1
                ;;
              build_failed | update_failed | canceled | deactivated)
                echo "::error::The deploy ended with status $status; the old version keeps serving."
                exit 1
                ;;
            esac
            echo "Status: $status"
          done

          url=$(render --retry 3 "$service" | jq -r .serviceDetails.url)
          for _ in $(seq 6); do
            version=$(curl -sS --fail --retry 3 "$url/healthcheck" | jq -r .system_info.version) || version=
            if [ "$version" = "$SHA" ]; then
              echo "Deployed \`$SHA\` (\`$REF\`) to $url." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deploy is live, but $url/healthcheck reports version '$version', not $SHA."
          exit 1
