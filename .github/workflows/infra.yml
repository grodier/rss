name: Infrastructure

# Plans infra/ changes on pull requests and applies them on main once the owner
# approves in the infrastructure environment. Never pull_request_target: fork
# code must never run with these secrets. See "Deploys" in infra/README.md.
# Markdown-only changes (the runbook) change no resources, so they don't run.
on:
  pull_request:
    paths: ["infra/**", "!infra/**.md"]
  push:
    branches: [main]
    paths: ["infra/**", "!infra/**.md"]

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_app_zone_id: ${{ secrets.CLOUDFLARE_APP_ZONE_ID }}
  TF_VAR_admin_access_email: ${{ secrets.ADMIN_ACCESS_EMAIL }}
  TF_VAR_app_internal_url: ${{ secrets.APP_INTERNAL_URL }}
  TF_VAR_backup_r2_access_key_id: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
  TF_VAR_backup_r2_secret_access_key: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Only branches in this repository: fork pull requests get no secrets, and
  # neither do Dependabot's, which can't read Actions secrets.
  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One plan per pull request at a time, never cancelled midway (a cancelled
    # run can leave the state lock behind). Plans don't wait behind an apply
    # waiting for approval; the state lock keeps them from running during one.
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10" # required_version in infra/versions.tf
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=infra init

      - name: terraform plan
        # Terraform is stopped before the job's limit: interrupted, it cancels
        # its calls and releases the state lock, which a killed job leaves
        # behind (see "A stale state lock" in infra/README.md). Its output
        # streams to the log, so a hang shows where it hangs.
        run: |
          set -o pipefail
          status=0
          timeout --signal=INT --kill-after=2m 10m \
            terraform -chdir=infra plan -lock-timeout=5m -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt" || status=$?
          {
            echo '## terraform plan'
            echo
            echo '```'
            cat "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infrastructure # waits for the owner's approval
    # One apply at a time, never cancelled midway. An apply waiting for
    # approval holds the group.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10" # required_version in infra/versions.tf
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=infra init

      # Stopped before the job's limit, like the plan: interrupted, Terraform
      # finishes the changes under way, saves the state and releases the lock.
      - name: terraform apply
        run: |
          timeout --signal=INT --kill-after=3m 25m \
            terraform -chdir=infra apply -auto-approve -lock-timeout=10m -no-color
