services:
  postgres:
    image: postgres:17
    container_name: rss-postgres
    environment:
      POSTGRES_USER: rssapp
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: rssapp_dev
    ports:
      - "5432:5432"
    volumes:
      - rss-postgres-data:/var/lib/postgresql/data

  # Catches the app's email: SMTP on 1025, web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: rss-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  rss-postgres-data:
