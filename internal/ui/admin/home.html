<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Overview - Paper Round admin</title>
  {{template "assets" "admin"}}
  {{template "admin-head"}}
</head>

<body>
  <div class="admin">
    {{template "admin-nav" .Nav}}
    <main class="admin-main admin-page">
      <header class="page-head">
        <h1>Overview</h1>
        <p>Admin {{.Version}} · rendered <time datetime="{{.RenderedAt.UTC.Format "2006-01-02T15:04:05Z"}}">{{.RenderedAt.UTC.Format "2006-01-02 15:04"}} UTC</time></p>
      </header>

      <section class="admin-section" aria-labelledby="people">
        <h2 id="people">People</h2>
        {{template "stat-row" .People}}
      </section>

      <section class="admin-section" aria-labelledby="content">
        <h2 id="content">Content</h2>
        {{template "stat-row" .Content}}
      </section>
    </main>
  </div>
</body>

</html>
