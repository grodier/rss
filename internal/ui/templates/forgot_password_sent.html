<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paper Round - check your email</title>
  <link rel="stylesheet" href="{{asset "css/main.css"}}" />
  {{template "favicons"}}
</head>

<body>
  <main class="solo">
    <div class="solo-panel">
      {{template "brand"}}
      <h1>Check your email</h1>

      <p class="solo-text">We sent a link to {{.Email}}. It works for 1 hour.</p>
      <form class="alt" action="/password/forgot" method="post">
        <input type="hidden" name="email" value="{{.Email}}" />
        Didn't get it? Check your spam folder, or <button class="link-button" type="submit">send another link</button>.
      </form>

      <p class="alt">Can't get into your email? Write to {{template "support-link" .SupportEmail}}.</p>

      {{template "policy-links"}}
    </div>
  </main>
</body>

</html>
