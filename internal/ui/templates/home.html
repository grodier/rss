<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paper Round</title>
  {{template "assets" "login"}}
  {{template "app-head"}}
</head>

<body>
  <main class="solo">
    <div class="solo-panel hero">
      {{with .Flash}}
      <div class="flash">{{.}}</div>
      {{end}}
      {{template "logo-mark"}}
      <h1>Paper Round</h1>
      <p>The sites you follow, in timelines you shape.</p>
      {{template "waitlist-form" .}}
      <p class="alt">Already have an account? <a href="/login">Log in</a></p>
      {{template "policy-links"}}
    </div>
  </main>
</body>

</html>
