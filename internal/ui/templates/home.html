<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paper Round</title>
  <link rel="stylesheet" href="{{asset "css/main.css"}}" />
  {{template "app-head"}}
</head>

<body>
  <main class="solo">
    <div class="solo-panel hero">
      {{with .Flash}}
      <div class="flash">{{.}}</div>
      {{end}}
      <img class="brand-mark" src="{{asset "img/logo.svg"}}" alt="">
      <h1>Paper Round</h1>
      <p>One quiet timeline for the sites you follow.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/login">Log in</a>
      </div>
      {{template "policy-links"}}
    </div>
  </main>
</body>

</html>
