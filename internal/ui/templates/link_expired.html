<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paper Round - {{.Title}}</title>
  {{template "assets" "solo"}}
  {{template "app-head"}}
</head>

<body>
  <main class="solo">
    <div class="solo-panel hero">
      {{template "brand"}}
      <h1>{{.Title}}</h1>
      {{with .Text}}<p>{{.}}</p>{{end}}
      {{with .Note}}<p>{{.}}</p>{{end}}
      <div class="hero-actions">
        {{with .Form}}
        <form action="{{.URL}}" method="post">
          <button class="btn-primary" type="submit">{{.Label}}</button>
        </form>
        {{end}}
        {{with .Link}}<a class="btn" href="{{.URL}}">{{.Label}}</a>{{end}}
      </div>
    </div>
  </main>
</body>

</html>
