<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>rss - login</title>
  <link rel="stylesheet" href="{{asset "css/main.css"}}" />
</head>

<body>
  <main class="solo">
    <div class="solo-panel">
      {{template "brand"}}
      <h1>Login</h1>

      {{with .Flash}}
      <div class="flash">{{.}}</div>
      {{end}}

      <form action="/login" method="post">
        {{range .Form.NonFieldErrors}}
        <div class="error">{{.}}</div>
        {{end}}
        <div class="field">
          <label for="email">Email</label>
          {{with .Form.FieldErrors.email}}
          <span class="error">{{.}}</span>
          {{end}}
          <input type="email" id="email" name="email" value="{{.Form.Email}}" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          {{with .Form.FieldErrors.password}}
          <span class="error">{{.}}</span>
          {{end}}
          <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>
        <div>
          <button class="btn-primary btn-block" type="submit">Login</button>
        </div>
      </form>

      {{if .SignupEnabled}}<p class="alt">No account? <a href="/signup">Sign Up</a></p>{{end}}
    </div>
  </main>
</body>

</html>
