{{define "app-head"}}<link rel="icon" href="{{asset "img/favicon.svg"}}" type="image/svg+xml" />
  <link rel="icon" href="{{asset "img/favicon-32.png"}}" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="{{asset "img/apple-touch-icon.png"}}" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1626" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-title" content="Paper Round" />{{end}}

{{/* html-theme is the data-theme attribute of a logged-in page's <html>,
     from its navData: the user's theme, or nothing to follow the system. */}}
{{define "html-theme"}}{{with .Theme}} data-theme="{{.}}"{{end}}{{end}}
