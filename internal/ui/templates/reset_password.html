<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paper Round - choose a new password</title>
  <link rel="stylesheet" href="{{asset "css/main.css"}}" />
  {{template "favicons"}}
  <script src="{{asset "js/app.js"}}" defer></script>
</head>

<body>
  <main class="solo">
    <div class="solo-panel">
      {{template "brand"}}
      <h1>Choose a new password</h1>

      {{$focus := .Form.FirstError "password"}}
      <form action="/password/reset" method="post">
        {{range .Form.NonFieldErrors}}
        <div class="error" role="alert">{{.}}</div>
        {{end}}
        <input type="hidden" name="token" value="{{.Form.Token}}" />
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" value="{{.Email}}" autocomplete="username" readonly />
        </div>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
            aria-describedby="password-hint{{if .Form.FieldErrors.password}} password-error{{end}}"
            {{with .Form.FieldErrors.password}}aria-invalid="true"{{end}}
            {{if eq $focus "password"}}autofocus{{end}} />
          <p class="hint" id="password-hint">At least 8 characters.</p>
          {{with .Form.FieldErrors.password}}<p class="error" id="password-error">{{.}}</p>{{end}}
        </div>
        <div>
          <button class="btn-primary btn-block" type="submit">Set new password</button>
        </div>
      </form>

      {{template "policy-links"}}
    </div>
  </main>
</body>

</html>
