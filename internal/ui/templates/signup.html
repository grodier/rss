<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>rss - signup</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>

<body>
  <main class="solo">
    <div class="solo-panel">
      {{template "brand"}}
      <h1>Sign Up</h1>

      <form action="/signup" method="post">
        <div class="field">
          <label for="name">Name</label>
          {{with .Form.FieldErrors.name}}
          <span class="error">{{.}}</span>
          {{end}}
          <input type="text" id="name" name="name" value="{{.Form.Name}}" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          {{with .Form.FieldErrors.email}}
          <span class="error">{{.}}</span>
          {{end}}
          <input type="email" id="email" name="email" value="{{.Form.Email}}" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          {{with .Form.FieldErrors.password}}
          <span class="error">{{.}}</span>
          {{end}}
          <input type="password" id="password" name="password" autocomplete="new-password" />
        </div>
        <div>
          <button class="btn-primary btn-block" type="submit">Sign up</button>
        </div>
      </form>

      <p class="alt">Already have an account? <a href="/login">Login</a></p>
    </div>
  </main>
</body>

</html>
