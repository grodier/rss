<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Paper Round - leave the waitlist</title>
  {{template "assets" "solo"}}
  {{template "app-head"}}
</head>

<body>
  <main class="solo">
    <div class="solo-panel">
      {{template "brand"}}
      <h1>Leave the waitlist?</h1>

      <form action="/waitlist/leave" method="post">
        <p class="solo-text">We'll delete your email and name.</p>
        <input type="hidden" name="token" value="{{.Token}}" />
        <div>
          <button class="btn-primary btn-block" type="submit">Leave the waitlist</button>
        </div>
      </form>
    </div>
  </main>
</body>

</html>
